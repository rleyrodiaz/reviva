<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reviva{% endblock %}</title>
    <script>
    (function () {
        try {
            var guardado = localStorage.getItem("reviva-theme");
            if (guardado === "day" || guardado === "night") {
                document.documentElement.setAttribute("data-theme", guardado);
            }
        } catch (e) {}
    })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/admin.css?v={{ static_version('css/admin.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    {% block theme_toggle %}
    <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-floating" aria-label="Cambiar a modo noche" title="Cambiar entre modo día y modo noche">
        <svg class="icon-sol" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
        </svg>
        <svg class="icon-luna" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.5A8.5 8.5 0 119.5 4a7 7 0 1010.5 10.5Z"/>
        </svg>
    </button>
    {% endblock %}
    <script>
    (function () {
        var boton = document.getElementById("theme-toggle");
        function temaEfectivo() {
            var explicito = document.documentElement.getAttribute("data-theme");
            if (explicito) return explicito;
            return window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
        }
        boton.addEventListener("click", function () {
            var siguiente = temaEfectivo() === "night" ? "day" : "night";
            document.documentElement.setAttribute("data-theme", siguiente);
            try { localStorage.setItem("reviva-theme", siguiente); } catch (e) {}
        });
    })();
    </script>
</body>
</html>
